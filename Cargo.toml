[package]
name = "ape-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "bigdecimal", "migrate"] }
bigdecimal = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
yellowstone-grpc-client = "8"
yellowstone-grpc-proto = "8"
futures = "0.3"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
